# Bori V3 — Training Configuration
# ==================================
# Centralized config for all training phases.
# Supports both SmolLM2-135M and SmolLM2-360M.

# ── Base Model ──
# Options: HuggingFaceTB/SmolLM2-135M, HuggingFaceTB/SmolLM2-360M
model_name: HuggingFaceTB/SmolLM2-360M
tokenizer_path: data/merged_tokenizer

# ── CPT Datasets ──
datasets:
  korean:
    name: HuggingFaceFW/fineweb-2:kor_Hang
    weight: 0.85
  english_replay:
    name: HuggingFaceFW/fineweb-edu-dedup
    weight: 0.15

# ── Phase 1a: Embedding Warm-up (backbone frozen, Korean only) ──
embedding_warmup:
  learning_rate: 1.0e-3
  max_steps: 1000
  batch_size: 2
  grad_accum: 4
  warmup_steps: 100
  lr_scheduler: cosine

# ── Phase 1b: Full CPT (all params, Korean + English replay) ──
# Token budget: 15000 steps × 2 batch × 16 accum × 2 GPUs × 2048 ctx ≈ 2B tokens
full_cpt:
  learning_rate: 3.0e-4
  max_steps: 15000
  batch_size: 2           # 360M fits batch=2 on T4 with grad_checkpointing
  grad_accum: 16
  warmup_steps: 300       # 2% of max_steps
  lr_scheduler: wsd       # Warmup-Stable-Decay (2% / 88% / 10%)
  min_lr_ratio: 0.1

# ── Phase 2: SFT ──
# 50% Korean, 50% English for balanced bilingual instruction following
sft:
  datasets:
    - name: brandonbaek/konglish-synthetic-instruct
      weight: 0.20
      lang: ko
    - name: jojo0217/korean_safe_conversation
      weight: 0.15
      lang: ko
    - name: maywell/ko_wikidata_QA
      weight: 0.15
      lang: ko
    - name: HuggingFaceH4/no_robots
      weight: 0.25
      lang: en
    - name: yahma/alpaca-cleaned
      weight: 0.25
      lang: en
  learning_rate: 5.0e-5
  max_steps: 3000
  batch_size: 1
  grad_accum: 32
  warmup_ratio: 0.05
  lr_scheduler: cosine

# ── Common ──
max_seq_length: 2048
fp16: true
attn_implementation: sdpa
save_steps: 500
save_total_limit: 3
seed: 42
