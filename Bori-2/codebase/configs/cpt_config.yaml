# Bori V2 — Continuous Pre-training Configuration

# Base model
model_name: HuggingFaceTB/SmolLM2-135M
tokenizer_path: data/merged_tokenizer

# Datasets
datasets:
  korean:
    name: HuggingFaceFW/fineweb-2:kor_Hang
    weight: 0.9
  english_replay:
    name: HuggingFaceFW/fineweb-edu
    weight: 0.1

# Phase 1a: Embedding Warm-up
embedding_warmup:
  learning_rate: 1.0e-3
  max_steps: 1000
  batch_size: 4
  grad_accum: 8
  warmup_steps: 100
  lr_scheduler: cosine

# Phase 1b: Full CPT
full_cpt:
  learning_rate_backbone: 2.0e-5
  learning_rate_embeddings: 1.0e-4
  max_steps: 10000
  batch_size: 4
  grad_accum: 8
  warmup_steps: 500
  lr_scheduler: constant_with_warmup

# Phase 2: SFT
sft:
  dataset: brandonbaek/konglish-synthetic-instruct
  learning_rate: 2.0e-5
  max_steps: 2000
  batch_size: 4
  grad_accum: 8
  warmup_steps: 200
  lr_scheduler: cosine

# Common
max_seq_length: 2048
fp16: true
save_steps: 1000
save_total_limit: 3
seed: 42
